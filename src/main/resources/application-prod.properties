app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${MYSQL_TLS_TRUST_STORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${MYSQL_TLS_TRUST_STORE_PASSWORD:}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=${MYSQL_TLS_FALLBACK_TO_SYSTEM_TRUST_STORE:true}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.forward-headers-strategy=framework
