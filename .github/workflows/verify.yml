name: Candidate checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bash mvnw --batch-mode verify

  secret-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --show-error --silent --location --output "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          control=$(mktemp -d)
          printf 'synthetic_test_key=ghp_%s\n' "$(openssl rand -hex 18)" > "$control/synthetic.txt"
          status=0
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --exit-code=42 "$control" > /dev/null 2>&1 || status=$?
          test "$status" -eq 42
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"

  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify and run OSV Scanner
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --show-error --silent --location --output "$scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          printf '%s  %s\n' fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8 "$scanner" | sha256sum --check --status
          chmod 0755 "$scanner"
          "$scanner" scan source --lockfile=pom.xml

  code-analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
