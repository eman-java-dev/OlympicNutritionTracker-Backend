name: Candidate checks
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bash mvnw --batch-mode verify

  secret-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          range=$(bash .github/scripts/secret-range.sh "$BASE_SHA" "$HEAD_SHA")
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --show-error --silent --location --output "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          control=$(mktemp -d)
          trap 'rm -rf -- "$control"' EXIT
          printf 'synthetic_test_key=ghp_%s\n' "$(openssl rand -hex 18)" > "$control/synthetic.txt"
          status=0
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --exit-code=42 "$control" > /dev/null 2>&1 || status=$?
          test "$status" -eq 42
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="$range"

  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test inventory and advisory validation
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Resolve all Maven scopes and generate CycloneDX
        run: |
          bash mvnw --batch-mode \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:tree \
            -DoutputType=json -DoutputFile=target/dependency-tree.json \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DincludeCompileScope=true -DincludeProvidedScope=true \
            -DincludeRuntimeScope=true -DincludeSystemScope=true \
            -DincludeTestScope=true -DoutputFormat=json
      - name: Validate the advisory snapshot and scan the SBOM offline
        run: bash .github/scripts/scan-maven-offline.sh

  code-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: bash mvnw --batch-mode clean test-compile
      - uses: github/codeql-action/analyze@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
